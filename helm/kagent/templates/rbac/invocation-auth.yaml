{{- if .Values.config.server.auth.serviceAccount }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-invocation-auth
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-invocation-auth
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kagent.fullname" . }}-invocation-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent.controller.serviceAccountName" . | quote }}
    namespace: {{ include "kagent.namespace" . }}
{{- end }}
