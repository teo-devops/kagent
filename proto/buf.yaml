version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore:
    - a2a.proto
    - api/ateapi/v1/ateapi.proto
    - ateenv/v1alpha/guest.proto
breaking:
  use:
    - FILE
  ignore_only:
    # Pre-release memory cleanup removes obsolete identity reservations.
    # Remove once the cleanup is present on the comparison branch.
    RESERVED_MESSAGE_NO_DELETE:
      - kagent/runtime/v1/memory.proto
    # Substrate v0.7.0-alpha1 renames the inventory types to substrate.ateapi.v1
    # without changing their wire shape. Remove after the upgrade reaches main.
    FIELD_SAME_TYPE:
      - kagent/api/v1/system.proto
  # Vendored Substrate APIs follow go.mod, including the v1 schema relocation.
  ignore:
    - ateapi.proto
    - api/ateapi/v1/ateapi.proto
    # Pre-1.0 ScheduledRun CRD cutover replaces the configuration contract,
    # including field numbers. Remove once the cutover is on the comparison branch.
    - kagent/api/v1/scheduled_runs.proto
  ignore_unstable_packages: true
